name: Tes & terbitkan

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Semua tes wajib lolos sebelum terbit
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # CDN Pages menyimpan cache JS ±10 menit. Seluruh modul ditaruh di folder per commit supaya
      # worker, engine, dan UI selalu berasal dari versi yang sama (tidak pernah campur lama-baru).
      - name: Rakit situs statis berversi
        run: |
          V="${GITHUB_SHA::8}"
          mkdir -p "_site/js/$V" "_site/css/$V"
          cp index.html _site/
          cp js/*.js "_site/js/$V/"
          cp css/*.css "_site/css/$V/"
          sed -i "s#src=\"js/app.js\"#src=\"js/$V/app.js\"#; s#href=\"css/style.css\"#href=\"css/$V/style.css\"#" _site/index.html
          grep -q "js/$V/app.js" _site/index.html
          grep -q "css/$V/style.css" _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
